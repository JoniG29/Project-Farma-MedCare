{% extends "base.html" %}

{% block title %}Restablecer Contraseña | Farmacia MedCare{% endblock %}

{% block content %}
    <div class="page-container" style="max-width: 450px; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h1 class="section-title" style="font-size: 30px; margin-bottom: 20px;">
            Establecer Nueva Contraseña
        </h1>

        <form method="POST" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
            
            <input type="password" name="password" placeholder="Nueva Contraseña (*)" required
                   style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
            
            <input type="password" name="confirm_password" placeholder="Confirmar Nueva Contraseña (*)" required
                   style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
            
            <p style="font-size: 12px; color: #666; margin: 0; text-align: left;">
                **Requisitos:** 8+ caracteres, al menos una mayúscula, una minúscula, un número y un símbolo (@$!%*?&).
            </p>
            
            <button type="submit" class="btn-add" 
                    style="width: 100%; height: 45px; margin-top: 15px; background-color: var(--color-azul-oscuro);">
                Restablecer y Guardar
            </button>
        </form>
    </div>
{% endblock %}
