{% extends "base.html" %}

{% block title %}Recuperar Contraseña | Farmacia MedCare{% endblock %}

{% block content %}
    <div class="page-container" style="max-width: 450px; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h1 class="section-title" style="font-size: 30px; margin-bottom: 10px;">
            Recuperar Contraseña
        </h1>
        <p style="margin-bottom: 20px; font-size: 14px; color: #666; text-align: center;">
            Ingresa tu correo electrónico registrado y simúlaremos el envío de un enlace para restablecer tu contraseña.
        </p>

        <form method="POST" action="{{ url_for('forgot_password') }}" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">

            <input type="email" name="email" placeholder="Correo Electrónico Registrado" required
                   style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">

            <button type="submit" class="btn-add"
                    style="width: 100%; height: 45px; margin-top: 15px; background-color: var(--color-rojo-coral); color: var(--color-blanco); border: none;">
                Enviar Enlace de Recuperación
            </button>
        </form>

        <p style="margin-top: 30px;">
            <a href="{{ url_for('login') }}" style="color: var(--color-azul-oscuro); font-weight: bold;">Volver al Inicio de Sesión</a>.
        </p>
    </div>
{% endblock %}
